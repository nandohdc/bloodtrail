name: release-please

on:
  push:
    branches:
      - main
  # Recovery hatch: re-run Release Please without pushing a commit to main.
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT, not GITHUB_TOKEN: pushes and pull requests authored by
          # GITHUB_TOKEN never trigger workflows, so the Release PR would receive
          # zero runs and could never satisfy the required status checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Labeling must stay ON. Release Please finds a *merged* Release PR by
          # its `autorelease: pending` label; with `skip-labeling: true` it never
          # tags, and each merge bumps the manifest without ever releasing.

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          ref: release-please--branches--main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: "26.5.0"

      - name: Deduplicate release PR changelog
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          node .github/scripts/clean-release-changelog.mjs --pr ${{ fromJson(steps.release.outputs.pr).number }}
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore: deduplicate release changelog"
            git push origin release-please--branches--main
          fi
