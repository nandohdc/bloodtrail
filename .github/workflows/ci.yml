name: ci

# A branch with an open PR used to fire both events, running the whole matrix
# twice and hitting the Sonar server concurrently with itself. The PR run
# reports the same required contexts against the same head SHA, so restricting
# push to main costs no coverage — a branch just has no CI until its PR exists.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # research/browser-telemetry — investigation package, not shipping code.
  # Job id stays `ci` so the required checks `ci / lint|test|audit` keep their names.
  ci:
    uses: nandohdc/gh-pipelines/.github/workflows/ci-node.yml@v1
    with:
      node-version: "26.5.0"                 # matches package.json engines >=26.5.0
      working-directory: "research/browser-telemetry"
      package-manager: "npm"
      lint-script: "lint"
      test-script: "test"
      coverage-min: 0                        # gate deferred (see follow-up)
      run-audit: true
      audit-level: "high"
      runner-label: ${{ vars.RUNNER_LABEL }}

  # packages/security-audit-sdk-core — the shipping SDK.
  # Cannot use ci-node.yml: that workflow checks out at the default shallow depth,
  # and validate's changed-paths/git/verification gates need the proposal baseline
  # commit to be an ancestor of HEAD. It also has no `lint` script to point at.
  sdk:
    name: sdk
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/security-audit-sdk-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                     # required by test:changed-paths, test:git, test:verification

      # Primary Node 26.5.0 leg: runs full validation chain including repository-level and governance gates
      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.0"             # engines: >=24 <25 || >=26 <27
          cache: npm
          cache-dependency-path: |
            packages/security-audit-sdk-core/package-lock.json
            packages/security-audit-sdk-node/package-lock.json
            packages/client-evidence-browser/package-lock.json
            packages/security-audit-collector/package-lock.json

      - name: Runner shape diagnostics
        run: |
          node -e "const os = require('node:os'); console.log({ hostname: os.hostname(), cpus: os.cpus().length, availableParallelism: os.availableParallelism(), RUNNER_TOOL_CACHE: process.env.RUNNER_TOOL_CACHE });"

      - run: npm ci

      # Before validate: validate runs `generate` first, which rewrites src/generated/
      # and would mask drift in the committed output.
      - name: Reject pre-existing generated drift
        run: npm run check:generated

      - run: npm run validate

      # DEPENDENCIES.md: "npm audit --audit-level=low must pass; findings are
      # not waived by this record." The other jobs stay at high — neither of
      # those packages documents a stricter policy. Retries on transport blips
      # (#286) without retrying genuine advisories.
      - run: node ../../.github/scripts/npm-audit-retry.mjs --audit-level=low

      - name: Install sdk-node dependencies
        run: npm ci
        working-directory: packages/security-audit-sdk-node

      - name: Validate sdk-node on Node 26.5.0
        run: npm run validate
        working-directory: packages/security-audit-sdk-node

      - name: Audit sdk-node
        run: node ../../.github/scripts/npm-audit-retry.mjs --audit-level=low
        working-directory: packages/security-audit-sdk-node

      - name: Install client-evidence-browser dependencies
        run: npm ci
        working-directory: packages/client-evidence-browser

      - name: Validate client-evidence-browser on Node 26.5.0
        run: npm run validate
        working-directory: packages/client-evidence-browser

      - name: Audit client-evidence-browser
        run: node ../../.github/scripts/npm-audit-retry.mjs --audit-level=low
        working-directory: packages/client-evidence-browser

      - name: Install collector dependencies
        run: npm ci
        working-directory: packages/security-audit-collector

      - name: Validate collector on Node 26.5.0
        run: npm run validate
        working-directory: packages/security-audit-collector

      - name: Audit collector
        run: node ../../.github/scripts/npm-audit-retry.mjs --audit-level=low
        working-directory: packages/security-audit-collector

      # Node 24.2.0 compatibility leg: runs matrix-safe product test loop under Node 24.2.0
      - name: Setup Node 24.2.0
        uses: actions/setup-node@v7
        with:
          node-version: "24.2.0"
          cache: npm
          cache-dependency-path: |
            packages/security-audit-sdk-core/package-lock.json
            packages/security-audit-sdk-node/package-lock.json
            packages/client-evidence-browser/package-lock.json
            packages/security-audit-collector/package-lock.json

      - name: Run matrix-safe product loop on Node 24.2.0
        run: npm run test:matrix

      - name: Run test on Node 24.2.0 (sdk-node)
        run: npm run test
        working-directory: packages/security-audit-sdk-node

      - name: Run test on Node 24.2.0 (client-evidence-browser)
        run: npm run test
        working-directory: packages/client-evidence-browser

      - name: Run test on Node 24.2.0 (collector)
        run: npm run test
        working-directory: packages/security-audit-collector

  # contracts/security-audit — the canonical contract.
  contract:
    name: contract
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: contracts/security-audit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: contracts/security-audit/package-lock.json

      - run: npm ci

      - run: npm run validate
      # ClientEvidenceEnvelope v1 (#123) is a separate contract with no package of its own. Its
      # drift check and fixture tests need only Node, so they run here beside the audit contract
      # rather than nowhere, which is what happened until #126 found it.
      - run: node --test ../client-evidence-envelope/tests/*.test.mjs

      - run: node ../../.github/scripts/npm-audit-retry.mjs --audit-level=high

  # Repository-level design-pattern governance. Deliberately has no npm install
  # step: the checker is dependency-free and the tests are plain .mjs run by
  # node --test, so this job introduces no root package and no publishable
  # workspace. See docs/design-pattern-governance.md.
  design-pattern-governance:
    name: design-pattern-governance
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                     # ancestry, activation, and grandfathering need complete history

      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.0"

      - name: Assert package discovery completeness
        run: node .github/scripts/check-package-discovery.mjs

      # A statement describing present behaviour must name the current canonical
      # contract version. `adr-contract` in check-coherence asserts only that the
      # new version appears somewhere across all ADRs concatenated — presence,
      # never absence — and is sdk-core-scoped, so it saw none of the eleven stale
      # statements #453 found across five workspaces and the root documents. The
      # repository-script test suite below already fails on the same defect; this
      # step exists so the failure names the file and line directly.
      - name: Assert contract version currency
        run: node .github/scripts/check-contract-version-currency.mjs

      # Every test beside a repository script, not a hand-named subset. Naming one
      # file made the set a hand-maintained list that silently fell behind twice:
      # npm-audit-retry.test.mjs was written and never run by any check, and the
      # merge gate's arms had no runner at all until this glob.
      - name: Repository script test suite
        run: node --test .github/scripts/*.test.mjs

      - name: Active change harness self-tests
        run: node .github/scripts/run-active-harness-tests.mjs

      - name: Governance checker
        run: node openspec/scripts/check-design-pattern-governance.mjs --phase final

      # Baseline plus candidate. A candidate checker is never the sole judge of
      # whether it weakened itself, so the merge-base version is run against the
      # candidate's data as well.
      - name: Baseline and candidate checkers
        run: node openspec/scripts/run-governance-dual-check.mjs --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      # One contract-reuse evaluation per active change, against the same
      # reviewed base as the dual check. Each evaluation fails closed on an
      # unattributable trigger path; unaffected changes report the
      # distinguishable approved skip instead of a false CRA-validated pass.
      - name: Contract reuse assessment
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          for change in $(find openspec/changes -mindepth 1 -maxdepth 1 -type d ! -name archive -exec basename {} \; | sort); do
            node openspec/scripts/contract-reuse/check.mjs --change "$change" --base "$base"
          done

      - name: Contract reuse assessment test suite
        run: node --test openspec/tests/contract-reuse/*.test.mjs

      - name: Governance test suite
        run: node --test openspec/tests/design-pattern-governance/*.test.mjs

      # This remains candidate evidence until an exact project-owner decision and
      # dedicated activation make it part of the trusted governance baseline. It
      # runs last so its failure cannot skip the independent checks above.
      # A pull request asks to merge, so it is checked at the merge stage; a push
      # to main is already merged and is checked at the candidate stage.
      - name: Normative precedence candidate checker
        continue-on-error: true
        run: |
          stage=candidate
          if test "${{ github.event_name }}" = "pull_request"; then
            stage=merge
          fi
          node openspec/scripts/check-normative-precedence.mjs --stage "$stage" --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  # Line coverage for the workspaces that have product code behind tests.
  # Runs on 26.5.0 because research/browser-telemetry declares `>=26.5.0`, the
  # highest engines floor among the four workspaces this job covers, and the SDK
  # must be built before its tests can run.
  coverage:
    name: coverage
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.0"
          cache: npm
          cache-dependency-path: |
            packages/security-audit-sdk-core/package-lock.json
            packages/security-audit-sdk-node/package-lock.json
            packages/client-evidence-browser/package-lock.json
            packages/security-audit-collector/package-lock.json
            research/browser-telemetry/package-lock.json

      - run: npm ci
        working-directory: packages/security-audit-sdk-core
      - run: npm run test:coverage
        working-directory: packages/security-audit-sdk-core

      - run: npm ci
        working-directory: packages/security-audit-sdk-node
      - run: npm run test:coverage
        working-directory: packages/security-audit-sdk-node

      - run: npm ci
        working-directory: packages/client-evidence-browser
      - run: npm run test:coverage
        working-directory: packages/client-evidence-browser

      - run: npm ci
        working-directory: packages/security-audit-collector
      - run: npm run test:coverage
        working-directory: packages/security-audit-collector

      - run: npm ci
        working-directory: research/browser-telemetry
      - run: npm run test:coverage
        working-directory: research/browser-telemetry

      # Each report records paths relative to its own package, but the scan runs
      # from the repository root, so Sonar cannot match them to indexed files.
      # The same step drops records naming files the scan excludes — built
      # output the runtime tests execute, and the generated validator, which
      # has no source map to map back to src/ — so the analyser is not handed
      # coverage for components it was told not to index (#442). The report
      # list, the source roots and the exclusion globs are all read from
      # sonar-project.properties rather than restated here.
      - name: Normalize lcov reports against the declared analysis scope
        run: node .github/scripts/normalize-coverage-reports.mjs

      # actions/upload-artifact has no step-level retry; one transport-level
      # ECONNRESET reds the required coverage context even though every
      # threshold passed, and the needs: [coverage] edge then prevents sonar
      # from ever starting (#345). One bounded retry converts a network blip
      # into a slow green run; a genuine failure — including a missing report
      # (if-no-files-found) — still fails twice. overwrite: true lets the
      # retry replace a partially created run-scoped container instead of
      # dying on an artifact-already-exists conflict; the coverage artifact
      # name has no other producer in the run.
      - name: Upload coverage artifact
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/security-audit-sdk-core/coverage/lcov.info
            packages/security-audit-sdk-node/coverage/lcov.info
            packages/client-evidence-browser/coverage/lcov.info
            packages/security-audit-collector/coverage/lcov.info
            research/browser-telemetry/coverage/lcov.info
          if-no-files-found: error
          overwrite: true

      - name: Wait before retrying the coverage artifact upload
        if: steps.upload.outcome == 'failure'
        run: sleep 10

      - name: Upload coverage artifact (retry)
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/security-audit-sdk-core/coverage/lcov.info
            packages/security-audit-sdk-node/coverage/lcov.info
            packages/client-evidence-browser/coverage/lcov.info
            packages/security-audit-collector/coverage/lcov.info
            research/browser-telemetry/coverage/lcov.info
          if-no-files-found: error
          overwrite: true

      # files/flags must stay on one line with no space after the comma: the CLI
      # splits on "," without trimming, and a folded scalar would fold the
      # newline into a leading space that makes the second path unresolvable.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/security-audit-sdk-core/coverage/lcov.info,packages/security-audit-sdk-node/coverage/lcov.info,packages/client-evidence-browser/coverage/lcov.info,packages/security-audit-collector/coverage/lcov.info,research/browser-telemetry/coverage/lcov.info
          flags: sdk,sdk-node,client-evidence-browser,collector,research
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: packages/security-audit-sdk-core/coverage/junit.xml,packages/security-audit-sdk-node/coverage/junit.xml,packages/client-evidence-browser/coverage/junit.xml,packages/security-audit-collector/coverage/junit.xml,research/browser-telemetry/coverage/junit.xml
          flags: sdk,sdk-node,client-evidence-browser,collector,research
          disable_search: true
          fail_ci_if_error: false

  # Scans the whole repository, configured by the root sonar-project.properties.
  # Depends only on the artifact-producing coverage job so Sonar runs in parallel
  # with the longer SDK/contract jobs while preserving build and test gating.
  sonar:
    needs: [coverage]
    # ci-topology permits a visible skip for untrusted PRs. Keep this at job
    # level: an empty successful scan step would misreport analysis as passed.
    # Check the author too, so maintainer updates do not trust a Dependabot PR.
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dirmngr (required by SonarScanner GPG verification)
        run: |
          if command -v dirmngr >/dev/null 2>&1; then
            echo "dirmngr is already installed"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Attempt $attempt: updating package list and installing dirmngr..."
            if sudo apt-get update -qq && sudo apt-get install -y -qq dirmngr; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to install dirmngr after 3 attempts"
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: "24.2.0"

      # Same defect class on the download side: one ECONNRESET redded the
      # sonar job having never contacted SonarQube (#345). Same bounded retry
      # shape; a failed download leaves no server-side state, so the retry
      # needs no overwrite semantics.
      - name: Download coverage artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: .

      - name: Wait before retrying the coverage artifact download
        if: steps.download.outcome == 'failure'
        run: sleep 10

      - name: Download coverage artifact (retry)
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: .

      # Type-aware TypeScript analysis needs the SDK's @types/node and compiler
      # resolvable from its tsconfig.
      - name: Install SDK dependencies for type-aware analysis
        working-directory: packages/security-audit-sdk-core
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install client-evidence-browser dependencies for type-aware analysis
        working-directory: packages/client-evidence-browser
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The analyser jars and the provisioned JRE land here. Caching them keeps
      # the download of the large javascript/typescript plugins off the critical
      # path of every run — that download is what the self-hosted server drops.
      - name: Cache SonarScanner plugins
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-plugins-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sonar-plugins-${{ runner.os }}-

      - name: SonarQube scan
        id: scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .

      # sonarqube-local intermittently resets plugin downloads mid-stream and
      # returns Cloudflare 502s. One retry turns a server blip into a slow green
      # run rather than a red required check; a real failure still fails twice.
      - name: Wait before retrying the scan
        if: steps.scan.outcome == 'failure'
        run: sleep 30

      - name: SonarQube scan (retry)
        if: steps.scan.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .

      - name: SonarQube quality gate
        id: quality_gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # The gate action reports only pass/fail. Surface which conditions broke
      # so triage does not require opening the dashboard.
      - name: Explain quality gate failure
        if: failure() && steps.quality_gate.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # GitHub runs this as `bash -e`, so errexit is already on and the
          # fallbacks below could never fire — a missing report file aborted the
          # step with exit 2 and buried the real error. Turn errexit back off.
          set +e
          set -uo pipefail
          report=.scannerwork/report-task.txt
          if [ ! -f "${report}" ]; then
            echo "no ${report}; the scan did not complete — see the scan step log"
            exit 0
          fi
          # Resolve via the analysis id recorded by the scan. Unlike projectKey
          # plus pullRequest, this works on editions without PR analysis.
          task_url="$(sed -n 's/^ceTaskUrl=//p' "${report}")"
          if [ -z "${task_url}" ]; then
            echo "no ceTaskUrl in ${report}; see the dashboard"
            exit 0
          fi
          analysis_id="$(curl -sS -u "${SONAR_TOKEN}:" "${task_url}" | jq -r '.task.analysisId // empty')"
          if [ -z "${analysis_id}" ]; then
            echo "analysis id not available yet; see the dashboard"
            exit 0
          fi
          base="${task_url%%/api/*}"
          curl -sS -u "${SONAR_TOKEN}:" \
            "${base}/api/qualitygates/project_status?analysisId=${analysis_id}" > gate.json
          failed="$(jq -r '.projectStatus.conditions[]? | select(.status == "ERROR")
                    | "FAILED  \(.metricKey): actual \(.actualValue), must be \(.comparator | ascii_downcase) \(.errorThreshold)"' gate.json)"
          if [ -n "${failed}" ]; then
            echo "${failed}"
          else
            echo "no failed conditions parsed; raw response:"
            cat gate.json
          fi
          project_key="$(sed -n 's/^projectKey=//p' "${report}")"
          if [ -n "${project_key}" ]; then
            echo "--- SonarQube issues in new code ---"
            curl -sS -u "${SONAR_TOKEN}:" \
              "${base}/api/issues/search?componentKeys=${project_key}&inNewCodePeriod=true&resolved=false" \
              | jq -r '.issues[]? | "\(.severity) \(.rule): \(.component):\(.line) \(.message)"'
          fi

  # CodeScene delta analysis — gates on newly introduced code health issues.
  # Runs only on PRs: push-to-main coverage comes from the SaaS project analysis,
  # not the CLI. Installs the cs binary fresh each run; the binary is tiny.
  #
  # Failure semantics are split deliberately. A CodeScene outage, an expired
  # licence or a broken install must not redden an unrelated PR, but a genuine
  # finding must. `continue-on-error` cannot express that: at job level it still
  # reports the job as failed (the red check remains) while swallowing real
  # findings, so it is applied to the install step alone and the analysis step
  # decides its own exit code.
  codescene-delta:
    name: codescene delta
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                     # cs delta resolves origin/<base> from the full remote refs

      # `-y` is the installer's headless flag. Without it the script blocks on
      # `read REPLY < /dev/tty` before appending to ~/.bashrc, and a runner has no
      # controlling terminal — the read fails, the script's `set -e` aborts, and the
      # binary it already installed goes unused. The .bashrc edit is irrelevant here
      # anyway; $GITHUB_PATH is what puts cs on PATH for the steps that follow.
      # Piping into `sh` means the flag has to travel through `sh -s --`.
      - name: Install CodeScene CLI
        id: install
        continue-on-error: true
        run: |
          curl -fsSL https://downloads.codescene.io/enterprise/cli/install-cs-tool.sh | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only affects later steps, so probe by absolute path. This
          # turns a half-installed binary into a clean failure of *this* step.
          "$HOME/.local/bin/cs" version

      - name: Report unavailable CLI
        if: steps.install.outcome == 'failure'
        run: |
          echo "::warning::CodeScene CLI could not be installed; delta analysis was skipped"

      - name: Delta analysis
        if: steps.install.outcome == 'success'
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CODESCENE_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # `cs delta` exits 0 *unconditionally* unless --error-on-warnings is passed —
          # `cs delta --help` states this outright. Without the flag this step reported
          # every PR as clean no matter what the analysis found, so the flag is what
          # makes it a gate at all. Verified on PR #51: the same run printed a full
          # findings JSON on stdout and still exited 0.
          #
          # With the flag, a non-zero exit still cannot separate a finding from an
          # expired token or a broken licence. Whether the run produced parseable JSON
          # is the second signal: an analysis that completed always emits JSON, a failed
          # one never does.
          set +e
          output="$(cs delta "origin/${BASE_REF}" --output-format json --error-on-warnings 2>delta.err)"
          status=$?
          set -e

          if [ "${status}" -eq 0 ]; then
            echo "No new code health issues." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if printf '%s' "${output}" | jq -e . >/dev/null 2>&1; then
            # Print to stdout as well as the step summary. A summary is readable
            # only in the web UI: it is absent from `gh run view --log` and from
            # the REST API, so a failure here could not be diagnosed by anyone
            # working from logs. Findings now appear in the job log too.
            echo "CodeScene reported new code health issues:"
            printf '%s\n' "${output}" | jq .
            {
              echo "### CodeScene: new code health issues"
              echo '```json'
              printf '%s\n' "${output}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          echo "::warning::cs delta did not complete; treating as advisory"
          cat delta.err
