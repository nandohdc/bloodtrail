name: ci

# A branch with an open PR used to fire both events, running the whole matrix
# twice and hitting the Sonar server concurrently with itself. The PR run
# reports the same required contexts against the same head SHA, so restricting
# push to main costs no coverage — a branch just has no CI until its PR exists.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # research/browser-telemetry — investigation package, not shipping code.
  # Job id stays `ci` so the required checks `ci / lint|test|audit` keep their names.
  ci:
    uses: nandohdc/gh-pipelines/.github/workflows/ci-node.yml@v1
    with:
      node-version: "26"                     # matches package.json engines >=26.5.0
      working-directory: "research/browser-telemetry"
      package-manager: "npm"
      lint-script: "lint"
      test-script: "test"
      coverage-min: 0                        # gate deferred (see follow-up)
      run-audit: true
      audit-level: "high"
      runner-label: ${{ vars.RUNNER_LABEL }}

  # packages/security-audit-sdk-core — the shipping SDK.
  # Cannot use ci-node.yml: that workflow checks out at the default shallow depth,
  # and validate's changed-paths/git/verification gates need the proposal baseline
  # commit to be an ancestor of HEAD. It also has no `lint` script to point at.
  sdk:
    name: sdk
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/security-audit-sdk-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                     # required by test:changed-paths, test:git, test:verification

      - uses: actions/setup-node@v7
        with:
          node-version: "26"                 # engines: >=24 <25 || >=26 <27
          cache: npm
          cache-dependency-path: packages/security-audit-sdk-core/package-lock.json

      - run: npm ci

      # Before validate: validate runs `generate` first, which rewrites src/generated/
      # and would mask drift in the committed output.
      - name: Reject pre-existing generated drift
        run: npm run check:generated

      - run: npm run validate

      # DEPENDENCIES.md: "npm audit --audit-level=low must pass; findings are
      # not waived by this record." The other jobs stay at high — neither of
      # those packages documents a stricter policy.
      - run: npm audit --audit-level=low

  # contracts/security-audit — the canonical contract.
  contract:
    name: contract
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: contracts/security-audit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: contracts/security-audit/package-lock.json

      - run: npm ci

      - run: npm run validate

      - run: npm audit --audit-level=high

  # Line coverage for the two workspaces that have product code behind tests.
  # Runs on Node 26 because both packages pin engines above the Node 22 the
  # sonar job uses, and the SDK must be built before its tests can run.
  coverage:
    name: coverage
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: |
            packages/security-audit-sdk-core/package-lock.json
            research/browser-telemetry/package-lock.json

      - run: npm ci
        working-directory: packages/security-audit-sdk-core
      - run: npm run test:coverage
        working-directory: packages/security-audit-sdk-core

      - run: npm ci
        working-directory: research/browser-telemetry
      - run: npm run test:coverage
        working-directory: research/browser-telemetry

      # Each report records paths relative to its own package, but the scan runs
      # from the repository root, so Sonar cannot match them to indexed files.
      - name: Rewrite lcov paths as repository-relative
        run: |
          node -e '
            const fs = require("node:fs");
            for (const [file, prefix] of [
              ["packages/security-audit-sdk-core/coverage/lcov.info", "packages/security-audit-sdk-core/"],
              ["research/browser-telemetry/coverage/lcov.info", "research/browser-telemetry/"],
            ]) {
              fs.writeFileSync(file, fs.readFileSync(file, "utf8").replaceAll(/^SF:/gm, "SF:" + prefix));
            }
          '

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            packages/security-audit-sdk-core/coverage/lcov.info
            research/browser-telemetry/coverage/lcov.info
          if-no-files-found: error

      # files/flags must stay on one line with no space after the comma: the CLI
      # splits on "," without trimming, and a folded scalar would fold the
      # newline into a leading space that makes the second path unresolvable.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/security-audit-sdk-core/coverage/lcov.info,research/browser-telemetry/coverage/lcov.info
          flags: sdk,research
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report-type: test_results
          files: packages/security-audit-sdk-core/coverage/junit.xml,research/browser-telemetry/coverage/junit.xml
          flags: sdk,research
          fail_ci_if_error: false

  # Scans the whole repository, configured by the root sonar-project.properties.
  # Waits on sdk and contract as well as ci so a scan is not spent on code that
  # does not build.
  sonar:
    needs: [ci, sdk, contract, coverage]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dirmngr (required by SonarScanner GPG verification)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dirmngr

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: .

      # Type-aware TypeScript analysis needs the SDK's @types/node and compiler
      # resolvable from its tsconfig.
      - name: Install SDK dependencies for type-aware analysis
        working-directory: packages/security-audit-sdk-core
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The analyser jars and the provisioned JRE land here. Caching them keeps
      # the download of the large javascript/typescript plugins off the critical
      # path of every run — that download is what the self-hosted server drops.
      - name: Cache SonarScanner plugins
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-plugins-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sonar-plugins-${{ runner.os }}-

      - name: SonarQube scan
        id: scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .

      # sonarqube-local intermittently resets plugin downloads mid-stream and
      # returns Cloudflare 502s. One retry turns a server blip into a slow green
      # run rather than a red required check; a real failure still fails twice.
      - name: Wait before retrying the scan
        if: steps.scan.outcome == 'failure'
        run: sleep 30

      - name: SonarQube scan (retry)
        if: steps.scan.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .

      - name: SonarQube quality gate
        id: quality_gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # The gate action reports only pass/fail. Surface which conditions broke
      # so triage does not require opening the dashboard.
      - name: Explain quality gate failure
        if: failure() && steps.quality_gate.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # GitHub runs this as `bash -e`, so errexit is already on and the
          # fallbacks below could never fire — a missing report file aborted the
          # step with exit 2 and buried the real error. Turn errexit back off.
          set +e
          set -uo pipefail
          report=.scannerwork/report-task.txt
          if [ ! -f "${report}" ]; then
            echo "no ${report}; the scan did not complete — see the scan step log"
            exit 0
          fi
          # Resolve via the analysis id recorded by the scan. Unlike projectKey
          # plus pullRequest, this works on editions without PR analysis.
          task_url="$(sed -n 's/^ceTaskUrl=//p' "${report}")"
          if [ -z "${task_url}" ]; then
            echo "no ceTaskUrl in ${report}; see the dashboard"
            exit 0
          fi
          analysis_id="$(curl -sS -u "${SONAR_TOKEN}:" "${task_url}" | jq -r '.task.analysisId // empty')"
          if [ -z "${analysis_id}" ]; then
            echo "analysis id not available yet; see the dashboard"
            exit 0
          fi
          base="${task_url%%/api/*}"
          curl -sS -u "${SONAR_TOKEN}:" \
            "${base}/api/qualitygates/project_status?analysisId=${analysis_id}" > gate.json
          failed="$(jq -r '.projectStatus.conditions[]? | select(.status == "ERROR")
                    | "FAILED  \(.metricKey): actual \(.actualValue), must be \(.comparator | ascii_downcase) \(.errorThreshold)"' gate.json)"
          if [ -n "${failed}" ]; then
            echo "${failed}"
          else
            echo "no failed conditions parsed; raw response:"
            cat gate.json
          fi
