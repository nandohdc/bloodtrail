name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # research/browser-telemetry — investigation package, not shipping code.
  # Job id stays `ci` so the required checks `ci / lint|test|audit` keep their names.
  ci:
    uses: nandohdc/gh-pipelines/.github/workflows/ci-node.yml@v1
    with:
      node-version: "26"                     # matches package.json engines >=26.5.0
      working-directory: "research/browser-telemetry"
      package-manager: "npm"
      lint-script: "lint"
      test-script: "test"
      coverage-min: 0                        # gate deferred (see follow-up)
      run-audit: true
      audit-level: "high"
      runner-label: ${{ vars.RUNNER_LABEL }}

  # packages/security-audit-sdk-core — the shipping SDK.
  # Cannot use ci-node.yml: that workflow checks out at the default shallow depth,
  # and validate's changed-paths/git/verification gates need the proposal baseline
  # commit to be an ancestor of HEAD. It also has no `lint` script to point at.
  sdk:
    name: sdk
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: packages/security-audit-sdk-core
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                     # required by test:changed-paths, test:git, test:verification

      - uses: actions/setup-node@v7
        with:
          node-version: "26"                 # engines: >=24 <25 || >=26 <27
          cache: npm
          cache-dependency-path: packages/security-audit-sdk-core/package-lock.json

      - run: npm ci

      # Before validate: validate runs `generate` first, which rewrites src/generated/
      # and would mask drift in the committed output.
      - name: Reject pre-existing generated drift
        run: npm run check:generated

      - run: npm run validate

      - run: npm audit --audit-level=high

  # contracts/security-audit — the canonical contract.
  contract:
    name: contract
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: contracts/security-audit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: contracts/security-audit/package-lock.json

      - run: npm ci

      - run: npm run validate

      - run: npm audit --audit-level=high

  # Scans the whole repository, configured by the root sonar-project.properties.
  # Waits on sdk and contract as well as ci so a scan is not spent on code that
  # does not build.
  sonar:
    needs: [ci, sdk, contract]
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dirmngr (required by SonarScanner GPG verification)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dirmngr

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Type-aware TypeScript analysis needs the SDK's @types/node and compiler
      # resolvable from its tsconfig.
      - name: Install SDK dependencies for type-aware analysis
        working-directory: packages/security-audit-sdk-core
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
