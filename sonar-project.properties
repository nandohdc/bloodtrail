# Repository-wide SonarQube configuration.
#
# Scans every declared package — the set held by DECLARED_PACKAGES in
# .github/scripts/check-package-discovery.mjs, asserted by
# assertSonarScopeCoversDeclaredPackages so this claim cannot go stale again.
# It was stale: the scan was widened once from research/browser-telemetry, and
# packages/security-audit-sdk-node and packages/security-audit-collector were
# never appended when they were added (#452).
#
# Repository tooling is deliberately NOT in scope. openspec/scripts/ and
# .github/scripts/ produce no coverage report — the coverage job runs
# test:coverage in the declared packages only — and the quality gate's
# new_coverage condition is evaluated on new code, so analysing them would fail
# the next pull request that edits a line in the governance checker or the merge
# gate. Bringing them in needs a coverage story first.
#
# Same projectKey as before so the existing project keeps its history.
sonar.projectKey=nandohdc_bloodtrail_e3ef77af-1937-442c-b4f1-4fea5eeada74
sonar.projectName=bloodtrail
sonar.sourceEncoding=UTF-8

# Authored production code, per workspace. There is no root package.json —
# each workspace is standalone, so every path is listed explicitly.
sonar.sources=packages/security-audit-sdk-core/src,packages/security-audit-sdk-core/scripts,packages/security-audit-sdk-core/examples,packages/security-audit-sdk-node/src,packages/security-audit-sdk-node/scripts,packages/client-evidence-browser/src,packages/client-evidence-browser/scripts,packages/security-audit-collector/src,packages/security-audit-collector/scripts,contracts/security-audit/scripts,research/browser-telemetry/lib,research/browser-telemetry/poc,research/browser-telemetry/scripts

# Whole test directories, including helpers — no test.inclusions filter, so
# shared fixtures (e.g. tests/verification/disposable-git.mjs) are analysed too.
sonar.tests=packages/security-audit-sdk-core/tests,packages/security-audit-sdk-node/tests,packages/client-evidence-browser/tests,packages/security-audit-collector/tests,contracts/security-audit/tests,research/browser-telemetry/tests

# Build output, dependencies, captured evidence, and generated artefacts.
# Both src/generated/ trees are derived from the contract and must never be
# hand-edited (see .hermes.md), so findings there would not be actionable — fix
# the generator instead, which IS analysed.
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-tests/**,**/dist-examples/**,**/.scannerwork/**,**/evidence/**,packages/security-audit-sdk-core/src/generated/**,packages/security-audit-collector/src/generated/**

# Type-aware analysis for the TypeScript SDK.
sonar.typescript.tsconfigPaths=packages/security-audit-sdk-core/tsconfig.json,packages/security-audit-sdk-node/tsconfig.json,packages/client-evidence-browser/tsconfig.json,packages/security-audit-collector/tsconfig.json

# Produced by the coverage job and restored as an artifact before the scan.
# Paths inside the reports are rewritten there to be repository-relative, by
# .github/scripts/normalize-coverage-reports.mjs, which also drops any record
# naming a file the exclusions above cover. Reports legitimately carry such
# records: the runtime tests execute built output, and the generated Ajv
# validator is a .cjs file that exists only under dist/ with no source map, so
# --enable-source-maps cannot map it back to src/ the way it maps every other
# record. Handing those to the scanner produced a permanent "Could not resolve
# N file paths" warning, and a warning that is always present cannot show that
# a real source file has stopped resolving (#442). The normalizer reads the
# scope from this file rather than restating it, and fails the coverage job on
# a record whose path does not exist.
#
# Every analysed package that produces a report is listed: the job produced the
# Node binding's and the collector's all along, and the scan discarded them.
sonar.javascript.lcov.reportPaths=packages/security-audit-sdk-core/coverage/lcov.info,packages/security-audit-sdk-node/coverage/lcov.info,packages/client-evidence-browser/coverage/lcov.info,packages/security-audit-collector/coverage/lcov.info,research/browser-telemetry/coverage/lcov.info

# Build, verification and demo tooling: still analysed for issues, but not held
# to a coverage threshold. scripts/ is excluded from the published package and
# poc/ is a proof of concept, so neither is product code under test.
sonar.coverage.exclusions=**/scripts/**,packages/security-audit-sdk-core/examples/**,research/browser-telemetry/poc/**

# Every standalone package owns its release-gate scripts, so their repeated
# policy checks are intentional. They remain analysed for findings; only CPD is
# limited to avoid treating that required package isolation as new duplication.
# The package-discovery assertion keeps this narrower than all repository scripts.
sonar.cpd.exclusions=packages/*/scripts/**
