# Repository-wide SonarQube configuration.
#
# Scans every workspace. Previously the scan was pinned to
# research/browser-telemetry, so the dashboard reported ~700 lines of code and
# never saw the shipping SDK or the contract.
#
# Same projectKey as before so the existing project keeps its history.
sonar.projectKey=nandohdc_bloodtrail_e3ef77af-1937-442c-b4f1-4fea5eeada74
sonar.projectName=bloodtrail
sonar.sourceEncoding=UTF-8

# Authored production code, per workspace. There is no root package.json —
# each workspace is standalone, so every path is listed explicitly.
sonar.sources=packages/security-audit-sdk-core/src,packages/security-audit-sdk-core/scripts,packages/security-audit-sdk-core/examples,contracts/security-audit/scripts,research/browser-telemetry/lib,research/browser-telemetry/poc,research/browser-telemetry/scripts

# Whole test directories, including helpers — no test.inclusions filter, so
# shared fixtures (e.g. tests/verification/disposable-git.mjs) are analysed too.
sonar.tests=packages/security-audit-sdk-core/tests,contracts/security-audit/tests,research/browser-telemetry/tests

# Build output, dependencies, captured evidence, and generated artefacts.
# src/generated/ is derived from the contract and must never be hand-edited
# (see .hermes.md), so findings there would not be actionable — fix the
# generator in scripts/generate-contract.mjs instead, which IS analysed.
sonar.exclusions=**/node_modules/**,**/dist/**,**/dist-tests/**,**/dist-examples/**,**/.scannerwork/**,**/evidence/**,packages/security-audit-sdk-core/src/generated/**

# Type-aware analysis for the TypeScript SDK.
sonar.typescript.tsconfigPaths=packages/security-audit-sdk-core/tsconfig.json

# Produced by the coverage job and restored as an artifact before the scan.
# Paths inside the reports are rewritten there to be repository-relative.
sonar.javascript.lcov.reportPaths=packages/security-audit-sdk-core/coverage/lcov.info,research/browser-telemetry/coverage/lcov.info

# Build, verification and demo tooling: still analysed for issues, but not held
# to a coverage threshold. scripts/ is excluded from the published package and
# poc/ is a proof of concept, so neither is product code under test.
sonar.coverage.exclusions=**/scripts/**,packages/security-audit-sdk-core/examples/**,research/browser-telemetry/poc/**
